[project]
name = "nonebot-plugin-chikari-yinpa-fix"
version = "2.0.5"
description = "NoneBot2 银趴插件（修复版）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "fjcdhc", email = "joeyep114514@outlook.com"}
]
dependencies = [
    "Pillow>=9.0.0",
    "nonebot2>=2.3.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-plugin-localstore>=0.7.0",
    "nonebot-plugin-value>=1.0.0",
    "nonebot-plugin-orm>=0.4.0",
]
keywords = ["nonebot", "plugin", "chikari", "yinpa", "fix"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/joeyep114514/nonebot_plugin_chikari_yinpa_Fix"
Source = "https://github.com/joeyep114514/nonebot_plugin_chikari_yinpa_Fix"
"Bug Tracker" = "https://github.com/joeyep114514/nonebot_plugin_chikari_yinpa_Fix/issues"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nonebot_plugin_chikari_yinpa*"]

[tool.setuptools.package-data]
"nonebot_plugin_chikari_yinpa" = ["data/*.json", "resource/*.ttf", "resource/*.ttc"]
